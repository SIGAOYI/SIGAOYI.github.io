    <!-- bigbigwave: 壮阔治愈系荧光大洋波浪 -->
    <script src="/js/three.min.js"></script>
    <script>
        var SEPARATION = 85,
            AMOUNTX = 62,
            AMOUNTY = 62;
        var container;
        var camera, scene, renderer;
        var particles, particle, count = 0;
        var mouseX = 0, mouseY = -280;
        var targetMouseX = 0, targetMouseY = -280;
        var windowHalfX = window.innerWidth / 2;
        var windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.top = '0';
            container.style.left = '0';
            container.style.zIndex = '1';
            document.body.appendChild(container);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(0, 360, 1100);

            scene = new THREE.Scene();
            particles = new Array();

            // 生成高质感自发光水珠/荧光海粒子纹理
            var canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            var ctx = canvas.getContext('2d');
            var grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');       // 晶莹浪尖反光白
            grad.addColorStop(0.35, 'rgba(56, 189, 248, 0.85)');    // 澄澈海青蓝
            grad.addColorStop(0.7, 'rgba(14, 116, 144, 0.35)');     // 深水幽蓝
            grad.addColorStop(1, 'rgba(3, 7, 18, 0)');              // 柔和羽化边缘
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);

            var material = new THREE.ParticleCanvasMaterial({
                program: function(context) {
                    context.drawImage(canvas, -8, -8);
                }
            });

            var i = 0;
            for (var ix = 0; ix < AMOUNTX; ix++) {
                for (var iy = 0; iy < AMOUNTY; iy++) {
                    particle = particles[i++] = new THREE.Particle(material);
                    particle.position.x = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
                    particle.position.z = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);
                    scene.add(particle);
                }
            }

            renderer = new THREE.CanvasRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('touchstart', onDocumentTouchStart, { passive: true });
            document.addEventListener('touchmove', onDocumentTouchMove, { passive: true });
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseMove(event) {
            targetMouseX = event.clientX - windowHalfX;
            targetMouseY = (event.clientY / 2.5) - windowHalfY;
        }

        function onDocumentTouchStart(event) {
            if (event.touches.length === 1) {
                targetMouseX = (event.touches[0].pageX - windowHalfX) * 1.5;
                targetMouseY = (event.touches[0].pageY / 2) - windowHalfY;
            }
        }

        function onDocumentTouchMove(event) {
            if (event.touches.length === 1) {
                targetMouseX = (event.touches[0].pageX - windowHalfX) * 1.5;
                targetMouseY = (event.touches[0].pageY / 2) - windowHalfY;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            render();
        }

        function render() {
            // 阻尼缓动镜头平滑跟踪
            mouseX += (targetMouseX - mouseX) * 0.04;
            mouseY += (targetMouseY - mouseY) * 0.04;

            camera.position.x += (mouseX * 0.4 - camera.position.x) * 0.03;
            camera.position.y += (-mouseY * 0.6 + 280 - camera.position.y) * 0.03;
            camera.lookAt(new THREE.Vector3(0, -60, -80));

            var i = 0;
            for (var ix = 0; ix < AMOUNTX; ix++) {
                for (var iy = 0; iy < AMOUNTY; iy++) {
                    particle = particles[i++];

                    // 复合海浪物理波算法：
                    // 1. 主涌浪 (Swell): 广阔开阔的长波
                    var swell = Math.sin((ix * 0.16) + (count * 0.8)) * 46;
                    // 2. 侧向洋流 (Cross sea): 横向交错起伏
                    var cross = Math.cos((iy * 0.19) + (count * 0.65)) * 40;
                    // 3. 斜向对角推力 (Diagonal drift)
                    var drift = Math.sin(((ix + iy) * 0.11) + (count * 0.5)) * 26;
                    // 4. 风浪表面微澜 (Choppy ripples): 细致水光波动
                    var ripple = Math.sin((ix * 0.36) - (iy * 0.28) + (count * 1.2)) * 10;

                    var y = swell + cross + drift + ripple;
                    particle.position.y = y;

                    // 浪尖水光凝聚效果：波峰粒子凝聚高亮变大，波谷微粒散落
                    var crest = (y + 115) / 230; // 归一化高度
                    if (crest < 0) crest = 0;
                    if (crest > 1) crest = 1;

                    var scale = 0.5 + Math.pow(crest, 1.8) * 3.6;
                    particle.scale.x = particle.scale.y = scale;
                }
            }

            renderer.render(scene, camera);
            // 极其宁静舒缓的潮汐流动速度
            count += 0.032;
        }
    </script>

                    break;
                }
            }
            return flag;
        }
