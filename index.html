<body>
    <!-- 纯 2D Canvas 波光大海画卷：不依赖 WebGL / 硬件加速，软件光栅化下也能满帧 -->
    <canvas id="ocean-canvas"></canvas>

    <div class="overlay" id="ui-overlay">
        <div id="headTitle">LawooTrip</div>
        <div id="subTitle">龟龟的博客</div>
        <div id="inp">
            <a href="https://axelrod.lawootrip.com/home/">摸一下</a>

    <script>
    (function() {
        'use strict';

        var canvas = document.getElementById('ocean-canvas');
        var ctx = canvas.getContext('2d', { alpha: false });
        var overlay = document.getElementById('ui-overlay');
        var body = document.body;

        var now = (window.performance && performance.now)
            ? function() { return performance.now(); }
            : function() { return Date.now(); };

        /* ============ 正弦查表：热循环里每帧数万次 Math.sin/cos 全部换成一次数组取值 ============ */
        var TWO_PI = Math.PI * 2;
        var SIN_N = 2048, SIN_MASK = SIN_N - 1, SIN_Q = SIN_N >> 2;
        var SIN_SCALE = SIN_N / TWO_PI;
        var SIN_T = new Float32Array(SIN_N);
        for (var _s = 0; _s < SIN_N; _s++) SIN_T[_s] = Math.sin(_s * TWO_PI / SIN_N);
        function fsin(a) { return SIN_T[(a * SIN_SCALE) & SIN_MASK]; }
        function fcos(a) { return SIN_T[(a * SIN_SCALE + SIN_Q) & SIN_MASK]; }

        /* ============ 画质档位：按实测帧耗时自动升降，弱机保波浪流畅 ============ */
        var QUALITY = [
            { scale: 1.00, layers: 28, minFrame: 0,  lite: false },
            { scale: 0.85, layers: 28, minFrame: 0,  lite: true  },
            { scale: 0.70, layers: 22, minFrame: 0,  lite: true  },
            { scale: 0.55, layers: 16, minFrame: 31, lite: true  }
        ];
        var level = 0, minLevel = 0;

        // Chrome 关掉硬件加速后 WebGL 会掉到 SwiftShader 或直接拿不到，以此作为初始档位的先验
        function gpuLooksSoftware() {
            try {
                var c = document.createElement('canvas');
                var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                if (!gl) return true;
                var ext = gl.getExtension('WEBGL_debug_renderer_info');
                if (!ext) return false;   // 被隐私策略屏蔽，不下结论，交给运行时自适应
                var r = String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '');
                return /swiftshader|software|llvmpipe|basic render|microsoft basic/i.test(r);
            } catch (e) { return false; }
        }
        if (gpuLooksSoftware()) { level = 1; minLevel = 1; }
        if (window.innerWidth * window.innerHeight > 2200000 && level < 1) level = 1;

        var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        var timeScale = reduceMotion ? 0.35 : 1;

        /* ============ 指针跟踪 ============ */
        var mouseX = 0, mouseY = 0;
        var targetMouseX = 0, targetMouseY = 0;
        var mousePixelX = window.innerWidth / 2;
        var mousePixelY = window.innerHeight * 0.7;
        var curMX = mousePixelX, curMY = mousePixelY;

        var width = 0, height = 0, horizon = 0, rScale = 1;
        var SEG = 120, stepX = 1, xs = null, waveA = null, waveB = null;

        function handlePointer(x, y) {
            targetMouseX = (x - width / 2) / (width / 2);
            targetMouseY = (y - height / 2) / (height / 2);
            mousePixelX = x;
            mousePixelY = y;
        }
        window.addEventListener('mousemove', function(e) {
            handlePointer(e.clientX, e.clientY);
        }, { passive: true, capture: true });
        window.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true, capture: true });

        /* ============ 连续数学色彩平滑插值函数（无阶跃、无硬分割线） ============ */
        function getOceanRGB(z) {
            var r, g, b, t;
            if (z < 0.22) {
                t = z / 0.22;
                r = 210 * (1 - t) + 105 * t;
                g = 115 * (1 - t) + 85 * t;
                b = 65 * (1 - t) + 95 * t;
            } else if (z < 0.52) {
                t = (z - 0.22) / 0.30;
                r = 105 * (1 - t) + 16 * t;
                g = 85 * (1 - t) + 85 * t;
                b = 95 * (1 - t) + 132 * t;
            } else {
                t = (z - 0.52) / 0.48;
                r = 16 * (1 - t) + 4 * t;
                g = 85 * (1 - t) + 18 * t;
                b = 132 * (1 - t) + 44 * t;
            }
            return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
        }

        /* ============ 波浪层常量：z / 振幅 / 颜色只跟层号有关，建一次用到底 ============ */
        var N = 0;
        var layerZ, layerNextZ, layerAmp, layerBaseY, layerNextBaseY;
        var layerTopC, layerBotC, layerGrad, layerGradT, layerGradB;

        function buildLayers(n) {
            N = n;
            layerZ = new Float32Array(N);
            layerNextZ = new Float32Array(N);
            layerAmp = new Float32Array(N);
            layerBaseY = new Float32Array(N);
            layerNextBaseY = new Float32Array(N);
            layerTopC = new Array(N);
            layerBotC = new Array(N);
            layerGrad = new Array(N);
            layerGradT = new Float32Array(N);
            layerGradB = new Float32Array(N);
            for (var i = 0; i < N; i++) {
                var p = i / (N - 1);
                var np = Math.min(1.0, (i + 1.25) / (N - 1));
                var z = Math.pow(p, 2.15);
                layerZ[i] = z;
                layerNextZ[i] = Math.pow(np, 2.15);
                layerAmp[i] = 6.0 + Math.pow(z, 1.35) * 82.0;
                layerTopC[i] = getOceanRGB(z);
                layerBotC[i] = getOceanRGB(Math.min(1.0, z + 0.18));
                layerGrad[i] = null;
            }
        }

        /* ============ 静态元素预渲染成精灵：把每帧的渐变求值换成一次位图拷贝 ============ */
        function makeSprite(w, h, paint) {
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            paint(c.getContext('2d'), w, h);
            return c;
        }

        // 天空只有纵向变化，缓存成窄条，每帧按当前地平线拉伸贴图
        var skyStrip = makeSprite(8, 512, function(c, w, h) {
            var g = c.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0.00, '#040d1a');
            g.addColorStop(0.35, '#0f243d');
            g.addColorStop(0.65, '#2e263d');
            g.addColorStop(0.85, '#8c433c');
            g.addColorStop(0.97, '#ea580c');
            g.addColorStop(1.00, '#fed7aa');
            c.fillStyle = g; c.fillRect(0, 0, w, h);
        });

        var mistStrip = makeSprite(8, 68, function(c, w, h) {
            var g = c.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0.0, 'rgba(254, 215, 170, 0.0)');
            g.addColorStop(0.4, 'rgba(254, 215, 170, 0.40)');
            g.addColorStop(0.7, 'rgba(180, 100, 60, 0.28)');
            g.addColorStop(1.0, 'rgba(15, 36, 61, 0.0)');
            c.fillStyle = g; c.fillRect(0, 0, w, h);
        });

        var sunGlow = makeSprite(384, 384, function(c, w) {
            var r = w / 2;
            var g = c.createRadialGradient(r, r, r * 0.017, r, r, r);
            g.addColorStop(0.00, 'rgba(254, 215, 170, 0.50)');
            g.addColorStop(0.35, 'rgba(251, 146, 60, 0.24)');
            g.addColorStop(0.70, 'rgba(234, 88, 12, 0.06)');
            g.addColorStop(1.00, 'rgba(3, 8, 20, 0.0)');
            c.fillStyle = g; c.fillRect(0, 0, w, w);
        });

        var sunCore = makeSprite(160, 160, function(c, w) {
            var r = w / 2;
            var g = c.createRadialGradient(r, r, 0, r, r, r);
            g.addColorStop(0.00, 'rgba(255, 255, 255, 1.0)');
            g.addColorStop(0.25, 'rgba(254, 243, 199, 0.95)');
            g.addColorStop(0.65, 'rgba(251, 146, 60, 0.65)');
            g.addColorStop(1.00, 'rgba(249, 115, 22, 0.0)');
            c.fillStyle = g; c.fillRect(0, 0, w, w);
        });

        var cursorGlow = makeSprite(160, 160, function(c, w) {
            var r = w / 2;
            var g = c.createRadialGradient(r, r, 0, r, r, r);
            g.addColorStop(0.0, 'rgba(254, 215, 170, 0.20)');
            g.addColorStop(0.4, 'rgba(251, 146, 60, 0.08)');
            g.addColorStop(1.0, 'rgba(3, 8, 20, 0.0)');
            c.fillStyle = g; c.fillRect(0, 0, w, w);
        });

        var sparkleImg = makeSprite(64, 64, function(c, w) {
            var r = w / 2;
            var g = c.createRadialGradient(r, r, 0, r, r, r);
            g.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
            g.addColorStop(0.4, 'rgba(254, 215, 170, 0.85)');
            g.addColorStop(1.0, 'rgba(251, 146, 60, 0.0)');
            c.fillStyle = g; c.fillRect(0, 0, w, w);
        });

        /* ============ 浮游波光钻石闪烁微粒 ============ */
        var SPARKLE_COUNT = 40;
        var sparkles = [];
        for (var sp0 = 0; sp0 < SPARKLE_COUNT; sp0++) {
            var sz = Math.random();
            sparkles.push({
                xFactor: (Math.random() - 0.5) * 0.45,
                z: sz,
                zp: Math.pow(sz, 2.15),
                phase: Math.random() * TWO_PI,
                size: 1.2 + Math.random() * 2.0
            });
        }

        /* ============ 尺寸与画质 ============ */
        function applySize() {
            width = window.innerWidth;
            height = window.innerHeight;
            horizon = height * 0.47;

            canvas.width = Math.max(1, Math.round(width * rScale));
            canvas.height = Math.max(1, Math.round(height * rScale));
            ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
            ctx.imageSmoothingEnabled = true;

            SEG = Math.max(48, Math.min(150, Math.round(width / 12)));
            stepX = width / SEG;
            xs = new Float32Array(SEG + 1);
            for (var j = 0; j <= SEG; j++) xs[j] = j * stepX;
            waveA = new Float32Array(SEG + 1);
            waveB = new Float32Array(SEG + 1);

            for (var i = 0; i < N; i++) layerGrad[i] = null;
        }

        function applyQuality() {
            var q = QUALITY[level];
            rScale = q.scale;
            if (q.layers !== N) buildLayers(q.layers);
            if (q.lite) { if (body.className.indexOf('perf-lite') < 0) body.className += ' perf-lite'; }
            else { body.className = body.className.replace(/\s*perf-lite/g, ''); }
            applySize();
        }

        buildLayers(QUALITY[level].layers);
        applyQuality();

        var resizeTimer = null;
        window.addEventListener('resize', function() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                resizeTimer = null;
                if (window.innerWidth !== width || window.innerHeight !== height) applySize();
            }, 120);
        }, false);

        /* ============ 单层波形：三角函数按步长递推，鼠标涟漪先用平方距离剪枝 ============ */
        function computeWave(i, out) {
            var z = layerZ[i], amp = layerAmp[i], baseY = layerBaseY[i];
            var parallaxX = mouseX * (z * 160);
            var lam1 = 110.0 + z * 440.0;
            var lam2 = 85.0 + z * 320.0;
            var surge = fsin(time * 0.85 + i * 0.42) * 0.22;

            var a1 = parallaxX / lam1 - time * 1.25 + i * 0.28, d1 = stepX / lam1;
            var a2 = parallaxX / lam2 + time * 0.90 - i * 0.36, d2 = stepX / lam2;
            var a3 = parallaxX * 0.02 - time * 0.70 + i,        d3 = stepX * 0.02;

            var dy = baseY - curMY;
            var hasRipple = dy > -240 && dy < 240;
            var dy2 = dy * dy;
            var rt = time * 3.0;

            for (var j = 0; j <= SEG; j++) {
                var s1 = fsin(a1), c1 = fcos(a1);
                // swell1 = sin θ + 0.35 sin 2θ − 0.15 cos θ，用倍角公式省掉一次查表
                var v = (s1 + 0.70 * s1 * c1 - 0.15 * c1
                       + 0.40 * fcos(a2)
                       + surge
                       + 0.06 * fsin(a3)) * amp;
                var y = baseY + v;
                if (hasRipple) {
                    var dx = xs[j] - curMX;
                    var dd2 = dx * dx + dy2;
                    if (dd2 < 57600) {
                        var dd = Math.sqrt(dd2);
                        y += fsin(dd * 0.08 - rt) * (1.0 - dd / 240) * 8.0;
                    }
                }
                out[j] = y;
                a1 += d1; a2 += d2; a3 += d3;
            }
        }

        /* ============ 裁剪贴图：屏幕外 / 海面下的部分不做混合 ============ */
        function blitClipped(img, dx, dy, dw, dh, maxY) {
            var l = dx < 0 ? -dx : 0;
            var r = (dx + dw) > width ? (dx + dw - width) : 0;
            var t = dy < 0 ? -dy : 0;
            var b = (dy + dh) > maxY ? (dy + dh - maxY) : 0;
            var w2 = dw - l - r, h2 = dh - t - b;
            if (w2 <= 0 || h2 <= 0) return;
            var sw = img.width, sh = img.height;
            ctx.drawImage(img,
                l / dw * sw, t / dh * sh, w2 / dw * sw, h2 / dh * sh,
                dx + l, dy + t, w2, h2);
        }

        var time = 0;
        var lastTX = 1e9, lastTY = 1e9;

        function draw(dt) {
            // 极速敏锐的鼠标跟随插值（原 0.18/帧，这里按实际帧长归一化，掉帧也不变手感）
            var k = 1 - Math.pow(0.82, dt / 16.7);
            mouseX += (targetMouseX - mouseX) * k;
            mouseY += (targetMouseY - mouseY) * k;
            curMX += (mousePixelX - curMX) * k;
            curMY += (mousePixelY - curMY) * k;

            var currentHorizon = horizon + mouseY * 75;
            var sunX = width / 2 + mouseX * 280;
            var sunY = currentHorizon - 10;
            var skyH = currentHorizon + 40;
            var i, j;

            // UI 标题视差悬浮：量化到整像素，指针静止时一个字节都不写，避免整层重绘
            var tx = (-mouseX * 24) | 0, ty = (-mouseY * 16) | 0;
            if (tx !== lastTX || ty !== lastTY) {
                overlay.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0)';
                lastTX = tx; lastTY = ty;
            }

            // 1. 落日大气天空
            ctx.drawImage(skyStrip, 0, 0, 8, 512, 0, 0, width, skyH);

            // 2. 太阳外晕与本体
            var R = width * 0.60;
            blitClipped(sunGlow, sunX - R, sunY - R, R * 2, R * 2, skyH);
            ctx.drawImage(sunCore, sunX - 80, sunY - 80, 160, 160);

            // 3. 3D 透视大洋涌浪
            var hSpan = height - currentHorizon;
            for (i = 0; i < N; i++) {
                var pY = mouseY * (layerZ[i] * 55);
                layerBaseY[i] = currentHorizon + layerZ[i] * hSpan + pY;
                layerNextBaseY[i] = currentHorizon + layerNextZ[i] * hSpan + pY;
            }

            var cur = waveA, nxt = waveB;
            computeWave(0, cur);

            for (i = 0; i < N; i++) {
                var last = (i === N - 1);
                if (!last) computeWave(i + 1, nxt);

                // 只填「本层浪线 → 下一层浪线」这条可见带。
                // 原来每层都一路填到画面底部，28 层叠出约 10 倍的无效重绘 —— 这是卡顿的真正大头。
                ctx.beginPath();
                ctx.moveTo(0, cur[0]);
                for (j = 1; j <= SEG; j++) ctx.lineTo(xs[j], cur[j]);
                if (last) {
                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                } else {
                    for (j = SEG; j >= 0; j--) {
                        var bY = cur[j] > nxt[j] ? cur[j] : nxt[j];
                        ctx.lineTo(xs[j], bY + 2);
                    }
                }
                ctx.closePath();

                var amp = layerAmp[i];
                var gT = layerBaseY[i] - amp;
                var gB = layerNextBaseY[i] + amp * 1.8;
                var grad = layerGrad[i];
                if (!grad || Math.abs(gT - layerGradT[i]) > 1 || Math.abs(gB - layerGradB[i]) > 1) {
                    grad = ctx.createLinearGradient(0, gT, 0, gB);
                    grad.addColorStop(0.0, layerTopC[i]);
                    grad.addColorStop(0.4, layerTopC[i]);
                    grad.addColorStop(1.0, layerBotC[i]);
                    layerGrad[i] = grad; layerGradT[i] = gT; layerGradB[i] = gB;
                }
                ctx.fillStyle = grad;
                ctx.fill();

                var tmp = cur; cur = nxt; nxt = tmp;
            }

            // 4. 鼠标悬浮海面光晕
            if (curMY > currentHorizon - 10) {
                ctx.drawImage(cursorGlow, curMX - 180, curMY - 180, 360, 360);
            }

            // 5. 地平线海天柔和过渡雾
            ctx.drawImage(mistStrip, 0, 0, 8, 68, 0, currentHorizon - 28, width, 68);

            // 6. 浮游金色/钻石波光闪烁微粒（呼吸式舒缓起伏）
            for (var k2 = 0; k2 < SPARKLE_COUNT; k2++) {
                var sp = sparkles[k2];
                var twinkle = fsin(time * 0.75 + sp.phase);
                if (twinkle <= 0) continue;
                var spZ = sp.z;
                var spBaseY = currentHorizon + sp.zp * hSpan + mouseY * (spZ * 55);
                var spColumnWidth = (width * 0.10) + spZ * (width * 0.38);
                var spX = sunX + sp.xFactor * spColumnWidth + mouseX * (spZ * 160) * 0.4;
                var spY = spBaseY + fsin(time * 1.5 + sp.phase) * (4.0 + spZ * 12.0);
                var rad = sp.size * (0.8 + spZ * 1.5) * 2.5;
                ctx.globalAlpha = twinkle * 0.85 * (0.5 + spZ * 0.5);
                ctx.drawImage(sparkleImg, spX - rad, spY - rad, rad * 2, rad * 2);
            }
            ctx.globalAlpha = 1;
        }

        /* ============ 主循环 + 帧耗时自适应 ============ */
        var lastTs = 0;
        var accFrame = 0, accDraw = 0, nFrame = 0;
        var warmup = 60, badStreak = 0, goodStreak = 0;

        function frame(ts) {
            requestAnimationFrame(frame);
            ts = ts || now();

            if (!lastTs) { lastTs = ts; return; }
            var dt = ts - lastTs;
            if (dt < 0 || dt > 250) dt = 16.7;

            var cap = QUALITY[level].minFrame;
            if (cap && dt < cap) return;            // 限帧档：跳过本帧，时间不推进，波浪速度不变
            lastTs = ts;

            time += dt * 0.0012 * timeScale;        // 原 60fps 下 0.020/帧 == 1.2/秒

            var t0 = now();
            draw(dt);
            accDraw += now() - t0;
            accFrame += dt;
            nFrame++;

            if (nFrame >= 45) {
                var avg = accFrame / nFrame, avgDraw = accDraw / nFrame;
                accFrame = 0; accDraw = 0; nFrame = 0;
                if (warmup > 0) {
                    warmup -= 45;
                } else if (avg > 22 && level < QUALITY.length - 1) {
                    goodStreak = 0;
                    if (++badStreak >= 2) { badStreak = 0; level++; applyQuality(); }
                } else if (level > minLevel && (avg < 18 || (cap && avgDraw < 5))) {
                    badStreak = 0;
                    if (++goodStreak >= 8) { goodStreak = 0; level--; applyQuality(); }
                } else {
                    badStreak = 0; goodStreak = 0;
                }
            }
        }

        document.addEventListener('visibilitychange', function() {
            lastTs = 0;     // 回到前台时重置时基，避免一次性大跨度时间跳变
        }, false);

        requestAnimationFrame(frame);

    })();
    </script>
