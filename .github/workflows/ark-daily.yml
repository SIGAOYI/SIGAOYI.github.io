name: ARK Cathie Wood weekly auto-post

# 每周五收盘后自动抓取 ARK 官方持仓，生成“原创”分析文章并直接发布到 _posts/（覆盖当周）。
# 护栏：数据日期未变 或 无成交 -> 不发帖。仅提交 _posts/ 与 _scripts/state/ 与 ark-data/。
# 全自动，无需手动触发（workflow_dispatch 仅作可选的手动补发入口）。

on:
  schedule:
    # GitHub 定时是“尽力而为”，常延迟数小时甚至丢弃（9-19 那次就从 02:30 拖到 07:28）。
    # 故周六多点 + 周日兜底重试；concurrency 串行 + last_date 去重，保证一周只发一篇、不重复。
    - cron: '30 2 * * 6'    # 周六 02:30 UTC（周五美股收盘后）
    - cron: '30 8 * * 6'    # 周六 08:30 UTC 补跑
    - cron: '30 16 * * 6'   # 周六 16:30 UTC 补跑
    - cron: '30 6 * * 0'    # 周日 06:30 UTC 最后兜底
  workflow_dispatch: {}   # 可选：Actions 页手动触发

permissions:
  contents: write

concurrency:
  group: ark-weekly-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate & publish ARK post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 _scripts/ark_daily_post.py

      - name: Commit post if created
        run: |
          if [ -n "$(git status --porcelain _posts _scripts/state ark-data)" ]; then
            git config user.name  "ark-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts _scripts/state ark-data
            git commit -m "chore(ark): 自动发布 Cathie Wood 每周持仓 [skip ci]"
            git push
            echo "Post published."
          else
            echo "No post today (no new data / no changes)."
          fi
